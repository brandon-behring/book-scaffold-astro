name: package-ci

# Active package CI — moved from package/.github/workflows/ci.yml (which
# GitHub Actions never discovered because workflows only run from the repo
# root .github/workflows/ path). Closes issue #10.
#
# Triggers on pushes/PRs touching the package, the create-book CLI, the
# demo workspace, or this workflow itself. Visual regression coverage is in
# its own workflow (.github/workflows/visual-pw.yml).

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'create-book/**'
      - 'demo/**'
      - '.github/workflows/package-ci.yml'
  pull_request:
    paths:
      - 'package/**'
      - 'create-book/**'
      - 'demo/**'

defaults:
  run:
    working-directory: package

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x']
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspace-aware)
        working-directory: ./
        run: npm install

      - name: Build (tsup -> dist)
        run: npm run build

      - name: Test (node:test against fixtures)
        run: npm test

      - name: Type-surface check (consumer-facing .d.ts resolves — #133)
        run: npm run check:types

      - name: Verify exports map shape
        run: |
          test -f dist/index.mjs    || (echo "missing dist/index.mjs" && exit 1)
          test -f dist/index.d.ts   || (echo "missing dist/index.d.ts" && exit 1)
          test -f dist/schemas.mjs  || (echo "missing dist/schemas.mjs" && exit 1)
          test -f dist/components/ToolFilter.mjs       || (echo "missing compiled ToolFilter" && exit 1)
          test -f dist/components/VersionSelector.mjs  || (echo "missing compiled VersionSelector" && exit 1)
          test -f dist/lib/katex-macros.mjs            || (echo "missing dist/lib/katex-macros.mjs" && exit 1)

      - name: Pack dry-run (inspect tarball contents)
        run: npm pack --dry-run

      - name: Consumer-root validate smoke (closes #8 regression coverage)
        working-directory: package/tests/visual/fixture
        run: |
          # The fixture has its own chapters under src/content/chapters/.
          # validate must report a non-zero chapter count from THIS directory,
          # not the package root. The pre-v3.4.0 bug returned "0 chapter(s)".
          out=$(npx --no-install book-scaffold validate 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -q "0 chapter(s) checked"; then
            echo "::error::validate reported 0 chapters — package-root bug (#8) regressed"
            exit 1
          fi
          echo "$out" | grep -E '[1-9][0-9]* chapter\(s\) checked' >/dev/null || (echo "::error::validate output missing expected chapter count line" && exit 1)

  smoke-demo:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspace-aware)
        working-directory: ./
        run: npm install

      - name: Build the toolkit
        working-directory: package
        run: npm run build

      - name: Build the in-repo demo (academic preset)
        working-directory: demo
        env:
          BOOK_PRESET: academic
        run: npx astro build

      - name: Verify demo emitted core routes
        working-directory: demo
        run: |
          test -f dist/print/index.html       || (echo "missing /print" && exit 1)
          test -f dist/references/index.html  || (echo "missing /references" && exit 1)
          test -f dist/search/index.html      || (echo "missing /search" && exit 1)
