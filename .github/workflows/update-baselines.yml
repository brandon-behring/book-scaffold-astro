name: update-baselines

# Manually regenerate visual-regression baselines in the SAME environment the
# `visual-regression` workflow compares against (ubuntu-latest + system
# google-chrome + ImageMagick), then commit them back to the dispatched branch.
#
# Why this exists: baselines can't be regenerated on a dev machine that differs
# from CI — screenshots diverge (~22% pixel difference on otherwise-unchanged
# pages), so locally-made baselines then FAIL the CI `visual` check. This
# workflow closes that gap — the blocker behind #82 and any change whose
# intended pixel diff exceeds MAX_AE.
#
# Usage:
#   gh workflow run update-baselines.yml --ref <branch>
#   (or Actions tab → "update-baselines" → Run workflow → pick the branch)
#
# After it runs, review the committed baseline PNGs in the PR's "Files changed"
# tab (GitHub renders image diffs side-by-side), then re-run the
# `visual-regression` check. NOTE: the baseline commit is pushed with
# GITHUB_TOKEN, which does NOT re-trigger workflows — re-run visual-regression
# manually (or push any follow-up commit) to get the green check.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why regenerate (recorded in the commit message)'
        required: false
        default: 'Regenerate visual-regression baselines after an intended render change'

permissions:
  contents: write

concurrency:
  group: update-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install (workspace-aware)
        run: npm install

      - name: Build the toolkit (tsup -> dist/)
        run: npm run build --workspace package

      - name: Install ImageMagick + Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # google-chrome-stable is pre-installed on ubuntu-latest runners;
          # verify and surface the version (must match the visual job's env).
          which google-chrome
          google-chrome --version

      - name: Regenerate baselines (./run.sh --update)
        working-directory: package/tests/visual
        env:
          CI: '1'
        run: ./run.sh --update

      - name: Commit + push regenerated baselines
        env:
          REASON: ${{ github.event.inputs.reason }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package/tests/visual/baselines/; then
            echo "No baseline changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package/tests/visual/baselines/
          git commit \
            -m "test(visual): regenerate baselines in CI" \
            -m "$REASON" \
            -m "Regenerated via the update-baselines workflow on $BRANCH. Review the image diffs before merging; re-run the visual-regression check (this commit was pushed by GITHUB_TOKEN and won't auto-trigger it)."
          git push origin "HEAD:$BRANCH"
          echo "Pushed regenerated baselines to $BRANCH."

      - name: Upload regenerated baselines (artifact, for review)
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-baselines
          path: package/tests/visual/baselines/
          retention-days: 14
