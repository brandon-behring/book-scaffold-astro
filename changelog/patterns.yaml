# changelog/patterns.yaml — registry of patterns tracked on /convergence/.
#
# Template placeholder: no patterns yet. The /convergence/ page renders
# honest "no patterns tracked" empty-state against an empty registry,
# so deleting every entry here is safe.
#
# If your book does NOT use convergence tracking, you can delete this
# file and remove the `patterns` + `changelog` collections from
# src/content.config.ts. The /convergence/ page would then fail to
# build; remove src/pages/convergence.astro and
# src/components/PatternTimeline.astro to complete the removal.
#
# If your book DOES use convergence tracking, add entries below. Each
# entry names a pattern that one or more tools may adopt; the per-tool
# changelog files (changelog/tools/*.yaml) reference these by `id`.
#
# Example (uncomment and adapt):
#
# - id: my-pattern
#   name: "My pattern"
#   description: >-
#     One-paragraph description of what the pattern is and why it matters.
#   category: safety       # one of: safety, scale, context, interaction, extension, other
#   convergence_date: null # null = not yet adopted by all tracked tools;
#                          #        set to the date the last tool adopted it

# Empty-array literal keeps the file valid YAML when you have no
