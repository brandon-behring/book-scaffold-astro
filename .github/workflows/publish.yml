name: publish

# Trusted publishing to npm via OIDC. No NPM_TOKEN secret required — npm and
# GitHub exchange short-lived credentials at publish time. Provenance attestation
# is automatic with trusted publishing (no --provenance flag needed).
#
# Trigger paths:
# - push:tag v*.*.* — normal release (developer tags + pushes, workflow fires)
# - workflow_dispatch — manual fire against an existing tag (e.g., v3.5.1 which
#   was tagged before this workflow existed)
#
# Lock-step contract: both @brandon_m_behring/book-scaffold-astro AND
# @brandon_m_behring/create-book must be at the same version as the tag. If
# either publish fails, the workflow exits and the other package's state must
# be reconciled manually before retrying.
#
# npm-side prerequisite: each package needs a "Trusted Publisher" config at
# npmjs.com (package settings → Trusted Publisher → GitHub Actions) with
# workflow filename `publish.yml` and `npm publish` allowed.
#
# v3.6.5 (closes #37):
# - Pre-publish smoke step (scaffold via local tarball + npm install + npm run build)
#   gates the publish on a working end-to-end scaffold. Catches the class of
#   regression the v3.6.1 → v3.6.4 hotfix chain surfaced (bib parser crashes,
#   missing routes, broken cite refs) BEFORE the irreversible npm publish.
# - Smoke verify uses an incremental-backoff retry loop instead of a flat sleep;
#   no longer false-fails on npm index propagation lag (observed on v3.5.2,
#   v3.6.2, v3.6.4).
# - actions/* bumped to @v6 (Node 24-compatible; eliminates Node 20 deprecation
#   warnings before the Sept 2026 removal date).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g., v3.5.1)'
        required: true
        type: string

permissions:
  id-token: write   # required for OIDC token generation
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Guard: a `file:*.tgz` ref in the committed lockfile (dogfood self-pack
      # pollution) points at a gitignored tarball, so CI `npm install` ENOENTs
      # mid-resolve. Fail fast with a clear remedy instead. (Caught the v4.26.0
      # publish failure; see fix(ci) prune-orphan commit.)
      - name: Guard against file-tarball refs in lockfile
        run: |
          if grep -nE 'file:[^"]*\.tgz' package-lock.json; then
            echo "::error::package-lock.json contains a file: tarball ref (dogfood pollution). On a clean checkout run 'rm -rf node_modules && npm install' to prune it, commit, then re-tag."
            exit 1
          fi
          echo "lockfile clean: no file: tarball refs"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install (workspace-aware)
        run: npm install

      - name: Build the toolkit (tsup -> dist/)
        run: npm run build --workspace package

      - name: Test the toolkit
        run: npm test --workspace package

      - name: Test create-book CLI
        run: npm test --workspace create-book

      - name: Verify lock-step versions match tag
        run: |
          pkg_version=$(node -p "require('./package/package.json').version")
          cb_version=$(node -p "require('./create-book/package.json').version")
          tag_ref="${{ inputs.tag || github.ref_name }}"
          tag_version="${tag_ref#v}"
          if [ "$pkg_version" != "$cb_version" ]; then
            echo "::error::Lock-step violation: package=$pkg_version create-book=$cb_version"
            exit 1
          fi
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag/version mismatch: tag=$tag_ref package.json=$pkg_version"
            exit 1
          fi
          echo "Lock-step OK: both packages at v$pkg_version, matches tag $tag_ref"

      - name: Pre-publish smoke (scaffold + install via local tarball + build)
        # v3.6.5 (closes #37 part 1): the hard gate that would have caught
        # v3.6.0 / v3.6.1 / v3.6.2 / v3.6.3 failures BEFORE npm publish.
        # Manually-verified recipe from v3.6.4, now automated.
        run: |
          set -euo pipefail
          cd package
          TARBALL=$(npm pack --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].filename))")
          TARBALL_PATH="$GITHUB_WORKSPACE/package/$TARBALL"
          cd "$GITHUB_WORKSPACE"

          SMOKE=$(mktemp -d)
          cd "$SMOKE"
          node "$GITHUB_WORKSPACE/create-book/bin/create-book.mjs" demo --preset=academic
          cd demo

          # Swap the toolkit dep to point at the just-packed local tarball.
          # This is what makes the smoke test about THIS tag's tarball,
          # not whatever's already on the registry.
          node -e "const p=require('./package.json');p.dependencies['@brandon_m_behring/book-scaffold-astro']='file:$TARBALL_PATH';require('fs').writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

          npm install
          npm run build

          # Hard assertions: prove the scaffolded book actually emitted what
          # consumers will see. Each assertion guards a class of failure from
          # the v3.6 chain.
          test -f dist/index.html                            # landing page (#28)
          test -f dist/chapters/week01-hello-world/index.html # chapter route (#28)
          test -f dist/references/index.html                  # bib pipeline (#39 et al)
          echo "Pre-publish smoke OK: scaffolded academic book built end-to-end against $TARBALL"

      - name: Publish @brandon_m_behring/book-scaffold-astro
        working-directory: package
        run: npm publish --access public

      - name: Publish @brandon_m_behring/create-book
        working-directory: create-book
        run: npm publish --access public

      - name: Smoke verify registry (incremental-backoff retry)
        # v3.6.5 (closes #37 part 2): replaces the flat-sleep + single npm view
        # with a retry loop. v3.5.2 / v3.6.2 / v3.6.4 all observed false
        # failures when npm view ran before the registry index caught up.
        # Total wait budget: 10 + 20 + 30 + 40 + 50 = 150s — enough for npm's
        # worst observed propagation lag while still failing loudly on real misses.
        run: |
          set -uo pipefail
          expected=$(node -p "require('./package/package.json').version")
          for attempt in 1 2 3 4 5; do
            sleep $((attempt * 10))
            pkg_v=$(npm view @brandon_m_behring/book-scaffold-astro version 2>/dev/null || true)
            cb_v=$(npm view @brandon_m_behring/create-book version 2>/dev/null || true)
            echo "Attempt $attempt: toolkit=$pkg_v create-book=$cb_v expected=$expected"
            if [ "$pkg_v" = "$expected" ] && [ "$cb_v" = "$expected" ]; then
              echo "Both at v$expected on registry (attempt $attempt)"
              exit 0
            fi
          done
          echo "::error::Registry did not reflect v$expected within 150s (5 attempts)"
          exit 1
