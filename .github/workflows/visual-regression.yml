name: visual-regression

# Triggers on any change under package/ so any component or style edit gets
# pixel-diffed against the committed baselines before merge.
#
# Tooling: chrome-headless for screenshots + ImageMagick `compare` for the
# diff metric. Both are pre-installed on `ubuntu-latest` runners. We don't
# use Playwright because its bundled chromium-headless-shell binary doesn't
# build for every Linux distro (Ubuntu 26.04 at time of writing).
#
# Regenerating baselines locally:
#   cd package/tests/visual && ./run.sh --update
# Human-review the PNGs in baselines/ before committing.
#
# Regenerating baselines in CI (when your local env diverges from CI — see #82):
#   gh workflow run update-baselines.yml --ref <branch>
# Runs ./run.sh --update in this same image and commits the PNGs to the branch.

on:
  pull_request:
    paths:
      - 'package/**'
      - '.github/workflows/visual-regression.yml'
  push:
    branches: [v3.0, main]
    paths:
      - 'package/**'
      - '.github/workflows/visual-regression.yml'

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install (workspace-aware)
        run: npm install

      - name: Build the toolkit (tsup -> dist/)
        run: npm run build --workspace package

      - name: Install ImageMagick + Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # google-chrome-stable is pre-installed on ubuntu-latest runners;
          # verify and surface the version for logs.
          which google-chrome
          google-chrome --version

      - name: Run visual regression suite
        working-directory: package/tests/visual
        env:
          CI: '1'
          MAX_AE: '50000'
        run: ./run.sh

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            package/tests/visual/diffs/
            package/tests/visual/baselines/
          retention-days: 14
